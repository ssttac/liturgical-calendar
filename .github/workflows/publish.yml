---
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # install & configure poetry
      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          virtualenvs-create: true
      # install dependencies
      - name: Install dependencies
        run: poetry install
      # run lint and tests before publishing
      - name: Run pylint
        run: "poetry run pylint --rcfile=.pylintrc liturgical_calendar"
      - name: Run tests
        run: poetry run pytest tests/
      # build the package (wheel + sdist)
      - name: Build Python package
        run: poetry build
      # publish to PyPI via trusted publishing (OIDC); for API-token auth instead,
      # add a `with:` block with `password: ${{ secrets.PYPI_API_TOKEN }}`
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
