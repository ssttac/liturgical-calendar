[tool.poetry]
name = "liturgical-calendar-tec"
version = "0.2.0"
description = "Library to determine liturgical dates and colours for the Episcopal Church of the USA"
authors = ["William Chen <william@willowcitrus.com>"]
readme = "README.md"
packages = [{include = "liturgical_calendar"}]

[tool.poetry.dependencies]
python = "^3.11"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pylint = ">=3"
autopep8 = "^2.0.4"
pytest = "^8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
liturgical_calendar = 'liturgical_calendar.liturgical:main'
